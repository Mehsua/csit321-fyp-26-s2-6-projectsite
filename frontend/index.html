<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoodBot</title>
    <style>
      *:focus-visible {
        outline: 2px solid #16a34a;
        outline-offset: 2px;
      }
      button:focus-visible {
        outline: 2px solid #16a34a;
        outline-offset: 2px;
      }
      @keyframes typing-dots {
        0%, 20% { opacity: 0.2; }
        50% { opacity: 1; }
        80%, 100% { opacity: 0.2; }
      }
      .dot { animation: typing-dots 1.2s infinite; display: inline-block; }
      .dot:nth-child(2) { animation-delay: 0.2s; }
      .dot:nth-child(3) { animation-delay: 0.4s; }
    </style>
  </head>
  <body>
    <a href="#main-content" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;" onfocus="this.style.cssText='position:fixed;left:0;top:0;width:auto;height:auto;padding:8px 16px;background:#16a34a;color:#fff;z-index:9999;font-size:14px;border-radius:0 0 8px 0;'">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
